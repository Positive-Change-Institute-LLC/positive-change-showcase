name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install suite
        run: pip install -r pci_defi_analysis_suite/requirements.txt pytest
      - name: Run tests
        run: python -m pytest tests -q
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Run demo
        run: python AAA_PROMETHEUS_SUPER_DEMO.py > /dev/null
      - name: Check Markdown links
        run: python tools/check_links.py
